<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GM • generateReport()</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    :root { --brand:#7c3aed; --bg:#f7f9fc; --card:#fff; --text:#111827; --muted:#6b7280; }
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Arial;background:var(--bg);color:var(--text)}
    .topbar{background:#3b0764;color:#fff;padding:12px 0;text-align:center}
    .container{max-width:760px;margin:40px auto;background:#fff;padding:20px;border-radius:12px;box-shadow:0 6px 16px rgba(0,0,0,.06)}
    h1{text-align:center;font-size:22px;margin:0 0 12px}
    label{display:block;margin-top:10px;font-size:14px;color:#374151}
    input,select{width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:10px}
    .btn{margin-top:12px;width:100%;padding:10px 14px;border:none;border-radius:10px;background:var(--brand);color:#fff;cursor:pointer}
    .box{margin-top:12px;padding:12px;border-radius:10px;background:#f8fafc;border:1px solid #e5e7eb}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{padding:8px;border-bottom:1px solid #e5e7eb;text-align:left;font-size:14px}
    th{background:#f3f4f6}
    a.back{display:inline-block;margin-top:14px;text-decoration:none;color:var(--brand)}
  </style>
</head>
<body>
  <div class="topbar"><strong>Poly Color IMS</strong> — General Manager: <em>generateReport()</em></div>

  <div class="container">
    <h1>Generate Report</h1>

    <form id="frm">
      <label>Report Type</label>
      <select id="reportType" name="reportType">
        <option value="production">Production</option>
        <option value="inventory">Inventory</option>
        <option value="finance">Finance</option>
      </select>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
        <div>
          <label>From Date (optional)</label>
          <input type="date" id="fromDate" name="fromDate" />
        </div>
        <div>
          <label>To Date (optional)</label>
          <input type="date" id="toDate" name="toDate" />
        </div>
      </div>

      <button class="btn" type="submit">Generate</button>
    </form>

    <div id="result" class="box" style="display:none"></div>
    <a class="back" href="./gm_dashboard.html">← Back to GM Dashboard</a>
  </div>

  <script>
    const frm = document.getElementById('frm');
    const result = document.getElementById('result');

    frm.addEventListener('submit', async (e)=>{
      e.preventDefault();
      const data = new URLSearchParams();
      ['reportType','fromDate','toDate'].forEach(id=>{
        data.append(id, document.getElementById(id).value);
      });

      const res = await fetch('./gm_generate_report.php', {
        method:'POST',
        headers:{'Content-Type':'application/x-www-form-urlencoded'},
        body: data.toString()
      });
      const out = await res.json();

      if(!out.success){
        result.style.display='block';
        result.innerHTML = '<strong>Error:</strong> ' + (out.message || 'Unknown error');
        return;
      }

      // Render per report type
      let html = `<strong>${out.title}</strong><br>${out.message || ''}`;

      if (out.reportType === 'production') {
        html += `<div style="margin-top:6px">Total Production (kg): <strong>${out.totalKg}</strong></div>`;
        if (out.rows && out.rows.length){
          html += `<table><thead><tr><th>Date/Time</th><th>Quantity (kg)</th></tr></thead><tbody>`;
          out.rows.forEach(r => html += `<tr><td>${r.logged_at}</td><td>${r.quantity_kg}</td></tr>`);
          html += `</tbody></table>`;
        }
      }

      if (out.reportType === 'inventory') {
        html += `<div style="margin-top:6px">Total Items In Stock: <strong>${out.totalStock}</strong></div>`;
        if (out.items && out.items.length){
          html += `<table><thead><tr><th>Item</th><th>Qty</th></tr></thead><tbody>`;
          out.items.forEach(r => html += `<tr><td>${r.item_name}</td><td>${r.qty}</td></tr>`);
          html += `</tbody></table>`;
        }
      }

      if (out.reportType === 'finance') {
        html += `<div style="margin-top:6px">Net Amount: <strong>LKR ${out.netAmount}</strong></div>`;
        if (out.recent && out.recent.length){
          html += `<table><thead><tr><th>Type</th><th>Amount</th><th>Date/Time</th></tr></thead><tbody>`;
          out.recent.forEach(r => html += `<tr><td>${r.txn_type}</td><td>${r.amount}</td><td>${r.occurred_at}</td></tr>`);
          html += `</tbody></table>`;
        }
      }

      result.style.display='block';
      result.innerHTML = html;
    });
  </script>
</body>
</html>
